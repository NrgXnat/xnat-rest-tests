# Rendered and applied by kubernetes/run-performance-tests.sh, which fills in the ${...} values. The pod waits for the
# script to upload the tests, runs them, and waits again until the script has collected the results.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  labels:
    app.kubernetes.io/name: xnat-performance-tests
spec:
  backoffLimit: 0
  activeDeadlineSeconds: ${DEADLINE_SECONDS}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xnat-performance-tests
    spec:
      serviceAccountName: xnat-performance-tests
      restartPolicy: Never
      containers:
        - name: tests
          image: ${IMAGE}
          workingDir: /work
          command: ["sh", "-c"]
          args:
            - |
              until [ -f /work/.ready ]; do sleep 2; done
              sh /work/run.sh
              echo $? > /work/.exit
              until [ -f /work/.collected ]; do sleep 5; done
              exit "$(cat /work/.exit)"
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 20Gi
