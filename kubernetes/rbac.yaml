# What the performance tests need to reset and restart the XNAT in this namespace through kubectl, when they run as a
# Job here (kubernetes/run-performance-tests.sh). Apply in the XNAT's namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xnat-performance-tests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xnat-performance-tests
rules:
  # Find the XNAT and database pods and wait for them to stop or become Ready.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Save the XNAT container's log before each stop.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Empty the data directories, copy plugins, save XNAT's logs directory and recreate the database.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Read the XNAT StatefulSet's pod template, switch its image, and scale it down and up.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xnat-performance-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xnat-performance-tests
subjects:
  - kind: ServiceAccount
    name: xnat-performance-tests
