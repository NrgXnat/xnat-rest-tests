# FOR TESTING ONLY. Not a deployment: the passwords are fixed and public, nothing is
# backed up, and nothing here is tuned or secured for real data. See README.md.
#
# Two XNAT nodes share one database and one data directory, as nodes of a multi-node
# site do. Each node is published on its own port so tests can address it directly,
# and a load balancer with no session affinity sits in front of both.
#
#   http://localhost:8080  load balancer, round robin, no affinity
#   http://localhost:8081  node A (primary node)
#   http://localhost:8082  node B
#
# Both nodes share an ActiveMQ broker and run the dist-events plugin from ./plugins, which
# up.sh fills, because multi-node sites are told to run it.
#
# Start it with ./up.sh rather than "docker compose up": the site has to be configured
# through node A before node B starts (README.md says why).

name: xnat-two-node

x-xnat-node: &xnat-node
  image: ${XNAT_IMAGE:?Set XNAT_IMAGE to an XNAT image, for example one built by build-image.sh}
  entrypoint: ["/bin/sh", "/usr/local/bin/two-node-start.sh"]
  depends_on:
    postgres:
      condition: service_healthy
    activemq:
      condition: service_healthy
  mem_limit: 3g
  healthcheck:
    # Tomcat opens its connector only after the webapp has started, so any HTTP answer means the node is up.
    test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 120s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xnat
      POSTGRES_PASSWORD: xnat
      POSTGRES_DB: xnat
    # pg_stat_statements lets query counts be compared between runs.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnat -d xnat"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The shared broker. Both nodes send XNAT's queued work through it, and the dist-events plugin
  # uses a topic on it to tell the other node about changes.
  activemq:
    image: apache/activemq-artemis:2.37.0
    environment:
      ARTEMIS_USER: xnat
      ARTEMIS_PASSWORD: xnat
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/61616'"]
      interval: 5s
      timeout: 5s
      retries: 30

  xnat-a:
    <<: *xnat-node
    hostname: xnat-a
    environment:
      NODE_ID: xnat-a
      PRIMARY_NODE: "true"
    ports:
      - "8081:8080"
    volumes:
      - data:/data/xnat
      - home-a:/data/xnat/home
      - ./plugins:/data/xnat/home/plugins:ro
      - ./two-node-start.sh:/usr/local/bin/two-node-start.sh:ro

  xnat-b:
    <<: *xnat-node
    hostname: xnat-b
    environment:
      NODE_ID: xnat-b
      PRIMARY_NODE: "false"
    ports:
      - "8082:8080"
    volumes:
      - data:/data/xnat
      - home-b:/data/xnat/home
      - ./plugins:/data/xnat/home/plugins:ro
      - ./two-node-start.sh:/usr/local/bin/two-node-start.sh:ro

  lb:
    image: nginx:1.27
    depends_on:
      xnat-a:
        condition: service_healthy
      xnat-b:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres:
  # Archive, prearchive, cache, build and the other data paths, shared by both nodes.
  data:
  # Each node's own XNAT home: configuration, logs, plugins and work files.
  home-a:
  home-b:
