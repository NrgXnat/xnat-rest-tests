# FOR TESTING ONLY. Round robin across both nodes with no session affinity, so
# consecutive requests in one session alternate between nodes.
#
# A node that errors is never skipped or retried on the other node (max_fails=0,
# proxy_next_upstream off): the error reaches the client instead of being hidden.

upstream xnat {
    # Shared by nginx's worker processes, which otherwise each keep their own round-robin position.
    zone xnat 64k;
    server xnat-a:8080 max_fails=0;
    server xnat-b:8080 max_fails=0;
}

server {
    listen 80;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://xnat;
        proxy_next_upstream off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Which node answered, as its container address. "docker compose exec lb getent hosts xnat-a xnat-b"
        # maps addresses to nodes.
        add_header X-Upstream $upstream_addr always;
    }
}
